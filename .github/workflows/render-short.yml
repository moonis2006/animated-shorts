name: Cloud Render Animated Short

on:
  push:
    branches:
      - render
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID (CheeseShort or BridgeShort)"
        required: true
        default: "CheeseShort"
      scale:
        description: "Resolution scale (0.5 = 540p fast, 0.6667 = 720p HD, 1.0 = 1080p Full HD)"
        required: true
        default: "0.6667"

jobs:
  render-chunks:
    name: Render Video Chunk ${{ matrix.chunk.id }}/5 (Apple GPU)
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - { id: "01", frames: "0-352" }
          - { id: "02", frames: "353-705" }
          - { id: "03", frames: "706-1058" }
          - { id: "04", frames: "1059-1411" }
          - { id: "05", frames: "1412-1763" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node packages
        run: npm install --no-audit --no-fund

      - name: Render Chunk ${{ matrix.chunk.id }}
        run: |
          COMP="${{ github.event.inputs.composition || 'CheeseShort' }}"
          SCALE="${{ github.event.inputs.scale || '0.6667' }}"
          mkdir -p out/chunks
          npx remotion render src/index.ts "$COMP" "out/chunks/chunk_${{ matrix.chunk.id }}.mp4" \
            --frames="${{ matrix.chunk.frames }}" \
            --codec=h264 --crf=18 --scale="$SCALE" \
            --gl=angle --concurrency=3 --timeout=120000 \
            --muted --props='{"post":{"dpr":0.6667}}'

      - name: Upload Chunk ${{ matrix.chunk.id }}
        uses: actions/upload-artifact@v4
        with:
          name: video-chunk-${{ matrix.chunk.id }}
          path: out/chunks/chunk_${{ matrix.chunk.id }}.mp4
          retention-days: 7

  merge-video:
    name: Merge Full Video + Audio Mix
    needs: render-chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Video Chunks 01..05
        uses: actions/download-artifact@v4
        with:
          pattern: video-chunk-*
          path: out/chunks
          merge-multiple: true

      - name: Concatenate Chunks & Mux Narrator/SFX Audio
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p out/cloud
          cp public/cheese/chunk_06.mp4 out/chunks/chunk_06.mp4
          for i in 01 02 03 04 05 06; do
            echo "file 'chunk_${i}.mp4'" >> out/chunks/list.txt
          done
          ffmpeg -y -f concat -safe 0 -i out/chunks/list.txt -i public/cheese/mix.mp3 \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest \
            out/cloud/tactical_fiction_cheese_short.mp4

      - name: Upload Final Full Video MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-short-output
          path: out/cloud/tactical_fiction_cheese_short.mp4
          retention-days: 14

name: Cloud Render Animated Short

on:
  push:
    branches:
      - render
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID (DodecahedronShort, CheeseShort, BridgeShort)"
        required: true
        default: "DodecahedronShort"
      scale:
        description: "Resolution scale (1.0 = 1080p Full HD)"
        required: true
        default: "1.0"

jobs:
  render-chunks:
    name: Render HD Video Part ${{ matrix.chunk.id }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - { id: "01", frames: "0-529" }
          - { id: "02", frames: "530-1059" }
          - { id: "03", frames: "1060-1589" }
          - { id: "04", frames: "1590-2129" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install Node packages
        run: npm install --no-audit --no-fund

      - name: Render Chunk ${{ matrix.chunk.id }}
        run: |
          COMP="${{ github.event.inputs.composition || 'DodecahedronShort' }}"
          SCALE="${{ github.event.inputs.scale || '1.0' }}"
          mkdir -p out/chunks
          npx remotion render src/index.ts "$COMP" "out/chunks/chunk_${{ matrix.chunk.id }}.mp4" \
            --frames="${{ matrix.chunk.frames }}" \
            --codec=h264 --crf=18 --scale="$SCALE" \
            --concurrency=4 --timeout=180000 --muted

      - name: Upload Chunk ${{ matrix.chunk.id }}
        uses: actions/upload-artifact@v4
        with:
          name: video-chunk-${{ matrix.chunk.id }}
          path: out/chunks/chunk_${{ matrix.chunk.id }}.mp4
          retention-days: 7

  merge-video:
    name: Merge Full 1080p Video + Audio Mix
    needs: render-chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All 4 Video Chunks
        uses: actions/download-artifact@v4
        with:
          pattern: video-chunk-*
          path: out/chunks
          merge-multiple: true

      - name: Concatenate Chunks & Mux Narrator/SFX Audio
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p out/cloud
          for i in 01 02 03 04; do
            echo "file 'chunk_${i}.mp4'" >> out/chunks/list.txt
          done

          COMP="${{ github.event.inputs.composition || 'DodecahedronShort' }}"
          if [ "$COMP" = "DodecahedronShort" ]; then
            AUDIO_FILE="public/dodecahedron/mix.mp3"
            OUTPUT_NAME="the_1700_year_old_roman_dodecahedron.mp4"
          elif [ "$COMP" = "CheeseShort" ]; then
            AUDIO_FILE="public/cheese/mix.mp3"
            OUTPUT_NAME="tactical_fiction_cheese_short.mp4"
          else
            AUDIO_FILE="public/dodecahedron/mix.mp3"
            OUTPUT_NAME="final_rendered_short.mp4"
          fi

          ffmpeg -y -f concat -safe 0 -i out/chunks/list.txt -i "$AUDIO_FILE" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest \
            "out/cloud/$OUTPUT_NAME"

      - name: Upload Final Full Video MP4
        uses: actions/upload-artifact@v4
        with:
          name: roman-dodecahedron-final-video
          path: out/cloud/*.mp4
          retention-days: 14

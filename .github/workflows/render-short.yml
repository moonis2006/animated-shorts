name: Cloud Render Animated Short

on:
  push:
    branches:
      - render
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID (CheeseShort or BridgeShort)"
        required: true
        default: "CheeseShort"
      scale:
        description: "Resolution scale (1.0 = 1080p Full HD)"
        required: true
        default: "1.0"

jobs:
  render-chunks:
    name: Render HD Video Part ${{ matrix.chunk.id }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - { id: "01", frames: "0-489" }
          - { id: "02", frames: "490-979" }
          - { id: "03", frames: "980-1469" }
          - { id: "04", frames: "1470-1959" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install Node packages
        run: npm install --no-audit --no-fund

      - name: Render Chunk ${{ matrix.chunk.id }}
        run: |
          COMP="${{ github.event.inputs.composition || 'CheeseShort' }}"
          SCALE="${{ github.event.inputs.scale || '1.0' }}"
          mkdir -p out/chunks
          npx remotion render src/index.ts "$COMP" "out/chunks/chunk_${{ matrix.chunk.id }}.mp4" \
            --frames="${{ matrix.chunk.frames }}" \
            --codec=h264 --crf=18 --scale="$SCALE" \
            --concurrency=4 --timeout=120000 --muted

      - name: Upload Chunk ${{ matrix.chunk.id }}
        uses: actions/upload-artifact@v4
        with:
          name: video-chunk-${{ matrix.chunk.id }}
          path: out/chunks/chunk_${{ matrix.chunk.id }}.mp4
          retention-days: 7

  merge-video:
    name: Merge Full 1080p Video + Audio Mix
    needs: render-chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All 4 Video Chunks
        uses: actions/download-artifact@v4
        with:
          pattern: video-chunk-*
          path: out/chunks
          merge-multiple: true

      - name: Concatenate Chunks & Mux Narrator/SFX Audio
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p out/cloud
          for i in 01 02 03 04; do
            echo "file 'chunk_${i}.mp4'" >> out/chunks/list.txt
          done
          ffmpeg -y -f concat -safe 0 -i out/chunks/list.txt -i public/cheese/mix.mp3 \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest \
            out/cloud/tactical_fiction_cheese_short.mp4

      - name: Upload Final Full Video MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-short-output
          path: out/cloud/tactical_fiction_cheese_short.mp4
          retention-days: 14
